<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.cdnfonts.com/css/be-vietnam-pro" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <title>Login / Registro</title>
</head>
<body style="background-color: #FCF9E6;">
    
    <div class="container text-center">
        <img src="cyncroLogo.png" class="tamaño-logo mb-2 mt-2" alt="logo de pagina">
        <div class="card mx-auto contenedor-login border-0 text-center py-4" style="width: 50%;">
            
            <div class="d-flex flex-wrap justify-content-center gap-4 mb-2">
                <button id="login" class="btn-personalizado btn-toggle px-4 py-2" style="font-size: 22px;">Iniciar sesión</button>
                <button class="btn-personalizado btn-toggle px-4 py-2" style="font-size: 22px;">Registrarse</button>
            </div>

            <h3 id="titulo-formulario" class="mt-3" style="font-family: 'Be Vietnam Pro'; color: #5D5A5A;">Iniciar Sesión</h3>

            <div class="separador-login mb-4 mx-auto mt-3"></div>

            <div class="d-flex flex-column gap-4 align-items-center mx-auto" style="width: 70%;">
                <input id="correo" type="text" class="textbox-personalizado py-2 px-1" placeholder="Nombre / Correo" style="font-size: 20px; width: 100%;">
                <input id="contrasena" type="password" class="textbox-personalizado py-2 px-1" placeholder="Contraseña" style="font-size: 20px; width: 100%;">
                <button id="btn-accion" class="btn-personalizado px-4 py-2" style="font-size: 25px;">Entrar</button>
            </div>
        </div>
    </div>

    <script src="Login_Registro.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
