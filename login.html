<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- adjuntar el css del bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- link pa adjuntar la fuente q vamos a usar -->
    <link href="https://fonts.cdnfonts.com/css/be-vietnam-pro" rel="stylesheet">

    <!-- adjuntar nuestro css -->
    <link href="style.css" rel="stylesheet">
    <title>Document</title>
</head>
<body style="background-color: #FCF9E6;">
    
    <div class="container text-center">
        <img src="cyncroLogo.png" class="tamaño-logo mb-2 mt-2" alt="logo de pagina">
        <div class="card mx-auto contenedor-login border-0 text-center py-4" style="width: 50%;">
            <div class="d-flex flex-wrap justify-content-center gap-4 mb-2">
                <button id="login" class="btn-personalizado btn-toggle px-4 py-2" style="font-size: 22px;">Iniciar sesión</button>
                <button class="btn-personalizado btn-toggle px-4 py-2" style="font-size: 22px;">Registrarse</button>
            </div>

            <div class="separador-login mb-4 mx-auto"></div>

            <div class="d-flex flex-column gap-4 align-items-center mx-auto" style="width: 70%;">
                <input id="correo" type="text" class="textbox-personalizado py-2 px-1" placeholder="Nombre / Correo" style="font-size: 20px; width: 100%;">
                <input type="text" class="textbox-personalizado py-2 px-1" placeholder="Contraseña" style="font-size: 20px; width: 100%;">
                <button class="btn-personalizado px-4 py-2" style="font-size: 25px;">Entrar</button>
            </div>
        </div>
    </div>

    <!-- script para q el boton q presiones se quede con el diseño de hover -->
    <script>
        let botonInicial = document.getElementById("login");
        let textBoxCorreo = document.getElementById("correo"); //obtener el textbox donde s epone el correo o username del wey q quiere entrar, lo vamos a ocupar ahorita en el listener
        botonInicial.classList.add('activo') //por default prender el botón de inciar sesión pq esa va a ser la interfáz por defecto

        const botones = document.querySelectorAll('.btn-toggle'); //agarra los botones q tengan la clase btn-toggle

        botones.forEach(boton => { //por cada boton encontrado
            boton.addEventListener('click', () => { //agregale un listener q haga lo siguiente al ser clickeado
                botones.forEach(b => b.classList.remove('activo')); //agarra cada boton otra vez pero quitale el activo a cada uno alv asi todos se apagan antes de prender el clickeado
                boton.classList.add('activo'); //ponle el activo al boton q clickeamos pa q se prenda

                if(boton != botonInicial) textBoxCorreo.setAttribute('placeholder', 'Correo'); //si el boton clickeado no es el inicial / el de login, entonces q el textbox nomás diga correo, pa q se note un cambio sabes
                else textBoxCorreo.setAttribute('placeholder', 'Nombre / Correo'); //si no ps ponlo como usualmente es´ta con nombre / correo
            });
        });
    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
